name: Import MySign Source Files (Multi-Folder)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-mysign:
    runs-on: macos-latest
    continue-on-error: true

    steps:
      # ---------------------------------------------------------
      # Checkout your repo
      # ---------------------------------------------------------
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "mysign-import-bot"
          git config user.email "bot@mysign.local"

      # ---------------------------------------------------------
      # Clone MySign repo
      # ---------------------------------------------------------
      - name: Clone MySign repository
        continue-on-error: true
        run: |
          echo "Cloning MySign..."
          git clone https://github.com/makkuenon/MySign mysign-source

      # ---------------------------------------------------------
      # Create destination folders
      # ---------------------------------------------------------
      - name: Create destination folders
        continue-on-error: true
        run: |
          mkdir -p mysign-src
          mkdir -p mysign-assets
          mkdir -p mysign-config
          mkdir -p mysign-scripts
          mkdir -p mysign-ui
          mkdir -p mysign-other

      # ---------------------------------------------------------
      # Auto-sort MySign files into separate folders
      # ---------------------------------------------------------
      - name: Sort MySign files
        continue-on-error: true
        run: |
          echo "Sorting MySign files..."

          # Source code (.swift, .m, .mm, .h, .cpp)
          find mysign-source -type f `\( -name "*.swift" -o -name "*.m" -o -name "*.mm" -o -name "*.h" -o -name "*.cpp" \)` \
            -exec cp {} mysign-src/ \;

          # Assets (.png, .jpg, .jpeg, .gif, .svg)
          find mysign-source -type f `\( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.gif" -o -name "*.svg" \)` \
            -exec cp {} mysign-assets/ \;

          # Config files (.plist, .json, .yaml, .yml)
          find mysign-source -type f `\( -name "*.plist" -o -name "*.json" -o -name "*.yaml" -o -name "*.yml" \)` \
            -exec cp {} mysign-config/ \;

          # Scripts (.sh, .py)
          find mysign-source -type f `\( -name "*.sh" -o -name "*.py" \)` \
            -exec cp {} mysign-scripts/ \;

          # UI files (.storyboard, .xib)
          find mysign-source -type f `\( -name "*.storyboard" -o -name "*.xib" \)` \
            -exec cp {} mysign-ui/ \;

          # Everything else
          find mysign-source -type f \
            -exec cp {} mysign-other/ \;

      # ---------------------------------------------------------
      # Commit & push sorted files
      # ---------------------------------------------------------
      - name: Commit sorted MySign files
        continue-on-error: true
        run: |
          git add mysign-src/ mysign-assets/ mysign-config/ mysign-scripts/ mysign-ui/ mysign-other/

          attempts=0
          max_attempts=3
          success=false

          while [ $attempts -lt $max_attempts ]; do
            attempts=$((attempts+1))
            echo "Commit attempt $attempts..."

            if git diff --cached --quiet; then
              echo "No changes to commit."
              break
            fi

            if git commit -m "Import MySign source files (sorted into folders)"; then
              echo "Commit succeeded."

              if git push; then
                echo "Push succeeded."
                success=true
                break
              else
                echo "Push failed, retrying..."
                git pull --rebase || true
              fi
            else
              echo "Commit failed, retrying..."
              git pull --rebase || true
            fi

            sleep 5
          done

          if [ "$success" = true ]; then
            echo "MySign import completed."
          else
            echo "MySign import failed after retries."
          fi

      # ---------------------------------------------------------
      # Summary bot
      # ---------------------------------------------------------
      - name: Summary bot
        continue-on-error: true
        run: |
          echo "MySign Multi-Folder Import Summary" > import-summary.txt
          echo "Completed at: $(date)" >> import-summary.txt
          echo "Folders created:" >> import-summary.txt
          echo "- mysign-src/" >> import-summary.txt
          echo "- mysign-assets/" >> import-summary.txt
          echo "- mysign-config/" >> import-summary.txt
          echo "- mysign-scripts/" >> import-summary.txt
          echo "- mysign-ui/" >> import-summary.txt
          echo "- mysign-other/" >> import-summary.txt

          git add import-summary.txt
          git commit -m "MySign import summary" || true
          git push || true
